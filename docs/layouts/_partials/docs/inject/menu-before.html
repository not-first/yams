<div class="theme-control">
  <button class="theme-toggle" type="button" id="theme-toggle" aria-pressed="false">
    <svg class="theme-toggle-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
    <svg class="theme-toggle-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <span class="theme-toggle-label">Dark theme</span>
  </button>
</div>

<script>
  (function () {
    const toggle = document.getElementById('theme-toggle');
    if (!toggle) return;

    function updateToggle(theme) {
      const isDark = theme === 'dark';
      toggle.setAttribute('aria-pressed', String(isDark));
      toggle.querySelector('.theme-toggle-label').textContent = isDark ? 'Light theme' : 'Dark theme';
    }

    const theme = window.YamsTheme;
    if (!theme) return;

    updateToggle(theme.get());
    toggle.addEventListener('click', function () {
      const nextTheme = theme.get() === 'dark' ? 'light' : 'dark';
      theme.set(nextTheme);
      updateToggle(nextTheme);
    });
  })();
</script>
